services:
  # Backend API Monolith
  - type: web
    name: preptrace-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  # Frontend React 19 Client
  - type: static
    name: preptrace-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # The app reads VITE_BACKEND_URL (see frontend/src/utils/axios.js), e.g. https://preptrace-backend.onrender.com
      - key: VITE_BACKEND_URL
        sync: false
    routes:
      # Single-page app: send every path to index.html so refreshing /dashboard works
      - type: rewrite
        source: /*
        destination: /index.html
