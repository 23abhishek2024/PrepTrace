# Run everything locally:   docker compose up --build
# Needs a .env file next to this one with JWT_SECRET and GROQ_API_KEY (see .env.example).
# Seed the RAG question bank once:   docker compose exec backend npm run seed:questions

services:
  mongodb:
    image: mongo:7.0
    container_name: preptrace_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - preptrace_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preptrace_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017/preptrace
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:5173
      - GROQ_API_KEY=${GROQ_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - MODEL_CACHE_DIR=/app/.model-cache
    volumes:
      - model_cache:/app/.model-cache # embedding model is downloaded only once
    depends_on:
      - mongodb
    networks:
      - preptrace_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this into the build; the browser calls the backend directly
        VITE_BACKEND_URL: http://localhost:8000
    container_name: preptrace_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - preptrace_net

volumes:
  mongo_data:
  model_cache:

networks:
  preptrace_net:
    driver: bridge
