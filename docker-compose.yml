version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: preptrace_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - preptrace_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preptrace_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017/preptrace
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:5173
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
    networks:
      - preptrace_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: preptrace_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - preptrace_net

volumes:
  mongo_data:

networks:
  preptrace_net:
    driver: bridge
